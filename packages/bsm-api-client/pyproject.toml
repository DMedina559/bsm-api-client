[build-system]
requires = ["setuptools>=80.9", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bsm-api-client"
dynamic = ["version"]
authors = [
    { name="DMedina559", email="dmedina559-github@outlook.com" },
]
description = "A Python client library for the Bedrock Server Manager API"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "jsonschema >=4.23,<5",
    "aiohttp >= 3.14.0,<4.0.0",
    "pydantic >= 2.11.0,< 2.14",
    "attrs >=22.2.0",
    "httpx >=0.23.1,<0.29.0",
]
keywords = ["minecraft", "bedrock", "server", "manager", "api", "client", "asyncio", "aiohttp", "bsm"]

[project.optional-dependencies]
dev = [
    "datamodel-code-generator >=0.39.0,<0.40",
    "bsm-test-utils >=1.0.0,<1.1",
    "pytest >=8.4.0,<9.2",
    "pytest-mock >=3.14.0,<3.16",
    "pytest-asyncio >= 1.1.0,< 1.5",
    "black >=25.1.0,<26.6",
    "flake8 >=7.3.0,<7.4",
    "isort >=5.13.0,<8.1",
    "mypy >=1.10.0,<2.2",
    "bedrock-server-manager @ git+https://github.com/DMedina559/bedrock-server-manager.git@dev",
    "openapi-python-client ==0.29.1",
    "pre-commit >=4.6.0,<4.7",
]

[project.urls]
"Homepage" = "https://github.com/DMedina559/bsm-api-client"
"Bug Tracker" = "https://github.com/DMedina559/bsm-api-client/issues"
"Changelog" = "https://github.com/DMedina559/bsm-api-client/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bsm_api_client*"]

[tool.setuptools.package-data]
bsm_api_client = ["py.typed", "generated/*.json", "generated/py.typed"]

[tool.setuptools_scm]
root = "../.."
local_scheme = "no-local-version"
fallback_version = "1.6.1.dev0"

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["bsm_api_client", "bsm_cli"]
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
