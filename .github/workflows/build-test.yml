# .github/workflows/build-test.yml

name: Build Lint Test

on:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'packages/**'
      - 'tools/**'
      - '.github/workflows/build-test.yml'
      - '.pre-commit-config.yaml'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e ./packages/bsm-api-client[dev] -e ./packages/bsm-cli[dev]

    - name: Run pre-commit
      run: |
        pre-commit run --all-files

    - name: Check fresh-checkout client and distributions
      run: |
        python -m pytest --ignore=packages/bsm-api-client/tests/integration
        python -m build packages/bsm-api-client
        python tools/check_distributions.py packages/bsm-api-client/dist/*

    - name: Validate OpenAPI generation
      run: |
        python tools/export_bsm_openapi.py --output openapi.json
        python tools/generate_client.py openapi.json
        PYTHONPATH=packages/bsm-api-client/src python -c "import bsm_api_client.generated"
        git diff --exit-code -- packages/bsm-api-client/src/bsm_api_client/generated

    - name: Run Pytest
      run: |
        python -m pytest

    - name: Show integration diagnostics
      if: failure()
      run: |
        if [ -f bedrock_server_manager_test.log ]; then
          tail -n 160 bedrock_server_manager_test.log
        fi
