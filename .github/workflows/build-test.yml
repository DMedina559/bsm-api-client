# .github/workflows/build-test.yml

name: Build Lint Test

on:
  pull_request:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'packages/**'
      - 'tools/**'
      - '.github/workflows/build-test.yml'
      - '.pre-commit-config.yaml'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install -e ./packages/bsm-api-client[dev] -e ./packages/bsm-cli[dev]

    - name: Run pre-commit
      run: |
        pre-commit run --all-files

    - name: Check fresh-checkout client and distributions
      run: |
        python -m pytest --ignore=packages/bsm-api-client/tests/integration
        python -m build packages/bsm-api-client
        python -m build packages/bsm-cli
        python tools/check_distributions.py packages/bsm-api-client/dist/*
        python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/bsm-sdist-wheels" packages/bsm-api-client/dist/*.tar.gz
        python tools/check_distributions.py "$RUNNER_TEMP"/bsm-sdist-wheels/*.whl

    - name: Test installed wheels
      run: |
        python -m venv --system-site-packages "$RUNNER_TEMP/bsm-wheel-smoke"
        "$RUNNER_TEMP/bsm-wheel-smoke/bin/python" -m pip install --ignore-installed --no-deps packages/bsm-api-client/dist/*.whl packages/bsm-cli/dist/*.whl
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/bsm-wheel-smoke/bin/python" -m pytest -c /dev/null --import-mode=importlib "$GITHUB_WORKSPACE/packages/bsm-cli/tests/test_cli_commands.py"

    - name: Validate OpenAPI generation
      run: |
        python tools/export_bsm_openapi.py --output openapi.json
        python -c "import json, pathlib; tracked=json.loads(pathlib.Path('packages/bsm-api-client/src/bsm_api_client/generated/openapi.json').read_text()); exported=json.loads(pathlib.Path('openapi.json').read_text()); assert tracked == exported, 'Bundled OpenAPI schema differs from pinned backend'"
        python tools/generate_client.py openapi.json
        PYTHONPATH=packages/bsm-api-client/src python -c "import bsm_api_client.generated; import bsm_api_client.generated.client"
        git diff --exit-code -- packages/bsm-api-client/src/bsm_api_client/generated/openapi.json

    - name: Run Pytest
      run: |
        python -m pytest

    - name: Show integration diagnostics
      if: failure()
      run: |
        if [ -f bedrock_server_manager_test.log ]; then
          tail -n 160 bedrock_server_manager_test.log
        fi
