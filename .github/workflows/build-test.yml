name: Build Lint Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - 'pyproject.toml'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build-test.yml'
      - '.pre-commit-config.yaml'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout backend under test
        uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          # Match the backend contract bundled with this client.
          ref: 2d86919a4ab736cb64b0fcf6c2c3af3ef2664c84
          path: backend-under-test

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e './packages/bsm-api-client[dev]' -e './packages/bsm-cli[dev]'
          python -m pip install -e './backend-under-test'

      - name: Build package
        if: matrix.python-version == '3.14'
        run: |
          python -m build packages/bsm-api-client
          python -m build packages/bsm-cli

      - name: Lint and type checks
        if: matrix.python-version == '3.14'
        run: |
          pre-commit run --all-files
          python -m bedrock_server_manager.web.contract --check packages/bsm-api-client/src/bsm_api_client/generated/openapi.json
          python scripts/generate_client.py packages/bsm-api-client/src/bsm_api_client/generated/openapi.json --check
          python scripts/generate_models.py --check

      - name: Run tests
        run: python -m pytest

      - name: Show integration diagnostics
        if: failure()
        run: |
          if [ -f bedrock_server_manager_test.log ]; then
            tail -n 160 bedrock_server_manager_test.log
          fi
