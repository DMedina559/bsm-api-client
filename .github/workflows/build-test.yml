name: Build and Test

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout backend under test
        uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: dev
          path: backend-under-test
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/bsm-api-client/pyproject.toml
            packages/bsm-cli/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e './packages/bsm-api-client[dev]' -e './packages/bsm-cli[dev]'
          python -m pip install -e './backend-under-test'

      - name: Build package
        if: matrix.python-version == '3.14'
        run: |
          python -m build packages/bsm-api-client
          python -m build packages/bsm-cli

      - name: Run tests
        run: python -m pytest

      - name: Show integration diagnostics
        if: failure()
        run: |
          if [ -f bedrock_server_manager_test.log ]; then
            tail -n 160 bedrock_server_manager_test.log
          fi
