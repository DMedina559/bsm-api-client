name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: build-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout backend under test
        uses: actions/checkout@v7
        with:
          repository: DMedina559/bedrock-server-manager
          ref: dev
          path: backend-under-test

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e './packages/bsm-api-client[dev]' -e './packages/bsm-cli[dev]'
          python -m pip install -e './backend-under-test'

      - name: Build package
        if: matrix.python-version == '3.14'
        run: |
          python -m build packages/bsm-api-client
          python -m build packages/bsm-cli

      - name: Run tests
        run: python -m pytest

      - name: Show integration diagnostics
        if: failure()
        run: |
          if [ -f bedrock_server_manager_test.log ]; then
            tail -n 160 bedrock_server_manager_test.log
          fi
