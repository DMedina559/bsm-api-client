# .github/workflows/build-test.yml

name: Build Lint Test

on:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'packages/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
        pip install --upgrade -e ./packages/bsm-api-client[dev]
        pip install --upgrade -e ./packages/bsm-cli[dev]

    - name: Run Black
      run: black --check packages

    - name: Run Isort
      run: isort --check-only packages

    - name: Run Mypy
      continue-on-error: true
      run: mypy packages

    - name: Run Flake8
      continue-on-error: true
      run: flake8 packages

    - name: Run Pytest
      run: |
        python -m pytest packages/bsm-api-client
        python -m pytest packages/bsm-cli
