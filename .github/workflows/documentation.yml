name: Documentation

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'packages/bsm-api-client/**'
      - 'scripts/**'
      - '.readthedocs.yaml'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: packages/bsm-api-client/pyproject.toml
      - run: python -m pip install 'packages/bsm-api-client[docs]'
      - run: python -m sphinx -W --keep-going -b html docs/source /tmp/bsm-client-docs
