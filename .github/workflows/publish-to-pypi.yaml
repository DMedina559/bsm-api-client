name: Publish Python Package using OIDC

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools-scm
          pip install 'openapi-python-client>=0.29.1,<0.30'

      - name: Build both packages before publishing
        run: |
          python -m build packages/bsm-api-client
          python -m build packages/bsm-cli
          python tools/check_distributions.py packages/bsm-api-client/dist/*
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.ref_name }}

      - name: Smoke test installed release wheels
        run: |
          python -m venv "$RUNNER_TEMP/bsm-release-smoke"
          "$RUNNER_TEMP/bsm-release-smoke/bin/python" -m pip install packages/bsm-api-client/dist/*.whl packages/bsm-cli/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bsm-release-smoke/bin/python" -c "from bsm_api_client.generated import Client; from bsm_api_client.generated_adapter import operation_module; assert Client and operation_module('get_account')"
          "$RUNNER_TEMP/bsm-release-smoke/bin/python" -m bsm_cli --help

      - name: Publish bsm-api-client to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/bsm-api-client/dist/

      - name: Publish bsm-cli to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/bsm-cli/dist/
