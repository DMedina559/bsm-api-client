name: Lint and Types

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  lint:
    uses: DMedina559/.github/.github/workflows/reusable-python-lint.yml@main
    with:
      install-target: "-e './packages/bsm-api-client[dev]' -e './packages/bsm-cli[dev]'"
      cache-dependency-path: |
        packages/bsm-api-client/pyproject.toml
        packages/bsm-cli/pyproject.toml
      extra-commands: |
        python scripts/generate_client.py packages/bsm-api-client/src/bsm_api_client/generated/openapi.json --check
        python scripts/generate_models.py --check
