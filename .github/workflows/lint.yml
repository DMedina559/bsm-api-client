name: Lint and Types

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e './packages/bsm-api-client[dev]' -e './packages/bsm-cli[dev]'
      - name: Style, types and generated API
        run: |
          pre-commit run --all-files
          python scripts/generate_client.py packages/bsm-api-client/src/bsm_api_client/generated/openapi.json --check
          python scripts/generate_models.py --check
