name: Sync Contracts

on:
  repository_dispatch:
    types: [bsm-contract-updated]
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Exact bedrock-server-manager commit SHA or ref
        required: false
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    uses: DMedina559/.github/.github/workflows/reusable-sync-contracts.yml@main
    with:
      target-branch: dev
      backend-ref: ${{ inputs.backend_sha || github.event.client_payload.backend_sha || 'dev' }}
      contract-hash: ${{ github.event.client_payload.contract_hash || '' }}
      install-command: python -m pip install -e './packages/bsm-api-client[dev]' -e './packages/bsm-cli[dev]'
      openapi-output: packages/bsm-api-client/src/bsm_api_client/generated/openapi.json
      generate-command: |
        python scripts/generate_client.py packages/bsm-api-client/src/bsm_api_client/generated/openapi.json
        python scripts/generate_models.py
      verify-command: |
        pre-commit run --all-files
        python -m pytest
      pr-title: 'feat(api): sync generated client and models from bedrock-server-manager'
    secrets:
      SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
