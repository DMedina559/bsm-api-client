[tool.pytest.ini_options]
testpaths = [
    "packages/bsm-cli/tests",
    "packages/bsm-api-client/tests",
]

pythonpath = [
    "packages/bsm-cli/src",
    "packages/bsm-api-client/src",
]

[tool.black]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
